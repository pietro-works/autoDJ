<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>autoDJ · Pietro Impagliazzo</title>
  <meta name="description" content="Private Spotify queue controller for continuous AI-assisted radio sessions.">
  <meta name="theme-color" content="#06080e">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260613-title1">
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>

  <main class="autodj-shell">

    <section class="command-stage" aria-labelledby="autodj-title">
      <div class="hero-mark" aria-hidden="true">
        <svg class="logo-svg" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
          <g class="logo-rotor">
            <circle cx="48" cy="48" r="43" stroke="currentColor" stroke-width="5.2" stroke-linecap="round"
                    stroke-dasharray="236.25 34.14" transform="rotate(-67.46 48 48)"/>
            <circle class="logo-orbit" cx="48" cy="5" r="6.9"/>
          </g>
          <circle class="logo-ripple" cx="48" cy="48" r="11" stroke="currentColor" stroke-width="1.9"/>
          <circle cx="48" cy="48" r="27" stroke="currentColor" stroke-width="2.3" opacity="0.12"/>
          <circle cx="48" cy="48" r="6.2" fill="currentColor"/>
        </svg>
      </div>

      <header class="hero">
        <h1 id="autodj-title" data-scramble-title="autoDJ" aria-label="autoDJ">autoDJ</h1>
        <p class="intro">continuous radio, steered by a vibe</p>
      </header>

      <form class="vibe-form" data-vibe-form>
        <div class="composer-shell">
          <label class="sr-only" for="vibe">Compose the session</label>
          <textarea id="vibe" name="vibe" maxlength="360" rows="1" placeholder="late night melodic house, warm, hypnotic, not too hard…" spellcheck="false"></textarea>

          <div class="composer-controls">
            <a class="spotify-btn" href="api/spotify-login.php" data-login-link>Connect Spotify</a>
            <button class="autodj-btn" type="submit" data-start data-toggle-autodj aria-label="Start autoDJ" title="Start autoDJ">
              <span class="autodj-btn-symbol" aria-hidden="true"></span>
              <span data-toggle-label>Start autoDJ</span>
            </button>
          </div>
        </div>

        <div class="notice" data-notice hidden></div>
      </form>
    </section>

    <section class="live-deck" aria-labelledby="queue-title">
      <div class="section-head queue-head">
        <p class="panel-eyebrow" id="queue-title">Now / queued</p>
      </div>

      <div class="now-card" data-current-track>
        <span class="empty">Waiting for a session.</span>
      </div>

      <div class="feed" data-feed aria-label="Queued by autoDJ"></div>
    </section>

  </main>

  <script src="app.js?v=20260613-guards1"></script>
</body>
</html>
